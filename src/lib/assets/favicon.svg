<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- juggling balls arc -->
  <circle cx="40" cy="24" r="9" fill="#f5c542"/>
  <circle cx="64" cy="14" r="9" fill="#e84b8a"/>
  <circle cx="88" cy="24" r="9" fill="#8b5cf6"/>
  <!-- head -->
  <circle cx="64" cy="48" r="12" fill="#f4e6d7"/>
  <!-- body -->
  <line x1="64" y1="60" x2="64" y2="92" stroke="#f4e6d7" stroke-width="5" stroke-linecap="round"/>
  <!-- left arm up -->
  <line x1="64" y1="70" x2="40" y2="50" stroke="#f4e6d7" stroke-width="4" stroke-linecap="round"/>
  <!-- right arm up -->
  <line x1="64" y1="70" x2="88" y2="50" stroke="#f4e6d7" stroke-width="4" stroke-linecap="round"/>
  <!-- left leg -->
  <line x1="64" y1="92" x2="48" y2="118" stroke="#f4e6d7" stroke-width="4" stroke-linecap="round"/>
  <!-- right leg -->
  <line x1="64" y1="92" x2="80" y2="118" stroke="#f4e6d7" stroke-width="4" stroke-linecap="round"/>
</svg>
